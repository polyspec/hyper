# Generated by binding from the interface contract; do not edit. Run make bindings to write it again.
[package]
name = "polyspec-hyper-php-ext"
version = "0.0.40"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "polyspec_hyper"
path = "src/lib.rs"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
panic-test = []
fault-test = ["polyspec-hyper/fault-test", "polyspec-http-form/fault-test", "polyspec-http-negotiation/fault-test", "polyspec-session-store/fault-test", "polyspec-template/fault-test"]
thread-test = []
thrown-count-test = []

[dependencies]
polyspec-hyper = { path = "../../rust" }
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.21", features = ["construct", "lock"] }
polyspec-http-cookie = { git = "https://github.com/polyspec/http-cookie.git", tag = "v0.0.9" }
polyspec-http-form = { git = "https://github.com/polyspec/http-form.git", tag = "v0.0.3", default-features = false }
polyspec-http-negotiation = { git = "https://github.com/polyspec/http-negotiation.git", tag = "v0.0.6" }
polyspec-php-serialization = { git = "https://github.com/polyspec/php-serialization.git", tag = "v0.0.16" }
polyspec-session-store = { git = "https://github.com/polyspec/session-store.git", tag = "v0.0.7", default-features = false }
polyspec-template = { git = "https://github.com/polyspec/template.git", tag = "v0.0.31" }
ext-php-rs = "=0.16.4"

[lints]
workspace = true
