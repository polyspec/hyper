[package]
name = "polyspec-hyper"
version = "0.0.0"
edition = "2021"
rust-version = "1.99.0"
description = "The rules of the hyper server that every runtime shares: media selection, representations, tags, cookies, the reply, the CSRF token and the order of a request"
repository = "https://github.com/polyspec/hyper.git"
publish = false
# The package holds the interface contract of the bindings beside the source, so that a repository that depends on
# this crate reads the contract from the package that Cargo resolved (bindgen design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json"]

[lib]
name = "polyspec_hyper"
path = "src/lib.rs"

[dependencies]
# The kind interface of every error (plan F-2, bindgen design E-1).
polyspec-bindgen-core = { git = "https://github.com/polyspec/bindgen.git", branch = "v1/rust-core" }
# The Cookie and Set-Cookie fields (CK-1 to CK-14; HY-129.13, HY-45.8, HY-52.13).
polyspec-http-cookie = { git = "https://github.com/polyspec/http-cookie.git", branch = "v1/rust-core" }
# The weights of Accept (NG-5 to NG-10; HY-116.17 to HY-116.20).
polyspec-http-negotiation = { git = "https://github.com/polyspec/http-negotiation.git", branch = "v1/rust-core" }
# The reading and writing of media types (MT-4, MT-6; HY-119.4, HY-121.11).
polyspec-http-media-type = { git = "https://github.com/polyspec/http-media-type.git", branch = "v1/rust-core" }
# The JSON text of HY-54.18 to HY-54.21 (RQ-006, RQ-011, RQ-028, RQ-030).
polyspec-json = { git = "https://github.com/polyspec/json.git", branch = "v1/rust-core" }
# The values of the data model and their JSON form (VAL-2, VAL-12, VAL-20; HY-44, HY-54.20).
polyspec-template = { git = "https://github.com/polyspec/template.git", branch = "v1/rust-core" }
# The store interface of a session and its values (SE-2, SE-7; HY-104.25, HY-104.30), which the host entries take.
# The stores of files and Redis are features of the library that the bindings build; the core needs the interface only.
polyspec-sessions = { git = "https://github.com/polyspec/sessions.git", branch = "v1/rust-core", default-features = false }
# The values of a session record (RQ-001 to RQ-012; HY-104.13, HY-104.14).
polyspec-php-serialize = { git = "https://github.com/polyspec/php-serialize.git", branch = "v1/rust-core" }
# The digests of HY-24.10, HY-53 and HY-122.10.
sha2 = "0.10"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
