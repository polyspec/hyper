[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-hyper-server"
version = "0.0.34"
description = "Server for the polyspec region protocol: manifest, routing, documents, JSON responses, actions and sessions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # The wheel asset of the template release v0.0.22 with the sha256 of that asset (H21.4, H23.5). uv.lock locks it with
    # its dependencies, and `make hyper-install-python` installs that lock into the venv of the package (H23.15).
    # The wheel asset of the php-serialize release v0.0.3 with the sha256 of that asset (HY-104).
    "polyspec-php-serialize @ https://github.com/polyspec/php-serialize/releases/download/v0.0.3/polyspec_php_serialize-0.0.3-py3-none-any.whl#sha256=161288375c236fe45f4ee6568d0ff73ce81d2ea29adc5598fb0dde78968c8063",
    "polyspec-template @ https://github.com/polyspec/template/releases/download/v0.0.22/polyspec_template-0.0.22-py3-none-any.whl#sha256=a1ddd4d7298c3ea30384d870c93f8e1f8822d2dece288270b1273233814599ef",
]

# The client of the session tests against a real Redis server (HY-115); an application names its own client.
[dependency-groups]
dev = ["redis==8.1.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polyspec.hyper" = ["py.typed"]

# uv reuses a built package until a cache key changes, so a new source file content must be a key of the install.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
