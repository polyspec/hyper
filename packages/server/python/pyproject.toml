[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-hyper-server"
version = "0.0.36"
description = "Server for the polyspec region protocol: manifest, routing, documents, JSON responses, actions and sessions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # The wheel asset of the template release v0.0.23 with the sha256 of that asset (H21.4, H23.5). uv.lock locks it with
    # its dependencies, and `make hyper-install-python` installs that lock into the venv of the package (H23.15).
    # The wheel asset of the php-serialize release v0.0.4 with the sha256 of that asset (HY-104).
    "polyspec-php-serialize @ https://github.com/polyspec/php-serialize/releases/download/v0.0.4/polyspec_php_serialize-0.0.4-py3-none-any.whl#sha256=7df6cf4ea5b47ec07483c17fe7863284a786ecbdcbadf1339e6ad38cc3e5e93e",
    "polyspec-template @ https://github.com/polyspec/template/releases/download/v0.0.23/polyspec_template-0.0.23-py3-none-any.whl#sha256=4c2e403e4942aebf18e38ff4dec1e0e945fc95538aef63357c6f0e4e5eab9565",
]

# The client of the session tests against a real Redis server (HY-115); an application names its own client.
[dependency-groups]
dev = ["redis==8.1.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polyspec.hyper" = ["py.typed"]

# uv reuses a built package until a cache key changes, so a new source file content must be a key of the install.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
