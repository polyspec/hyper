[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-hyper-server"
version = "0.0.38"
description = "Server for the polyspec region protocol: manifest, routing, documents, JSON responses, actions and sessions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # The wheel asset of the template release v0.0.26 with the sha256 of that asset (H21.4, H23.5). uv.lock locks it with
    # its dependencies, and `make hyper-install-python` installs that lock into the venv of the package (H23.15).
    # The wheel asset of the php-serialize release v0.0.6 with the sha256 of that asset (HY-104).
    "polyspec-php-serialize @ https://github.com/polyspec/php-serialize/releases/download/v0.0.6/polyspec_php_serialize-0.0.6-py3-none-any.whl#sha256=00d8022dd33432532dbbbd3bed072e33d9243784b5454ddc814f867be14bc716",
    "polyspec-template @ https://github.com/polyspec/template/releases/download/v0.0.26/polyspec_template-0.0.26-py3-none-any.whl#sha256=65458672f868bee77de9d6536f631f138cc17e9f2ff21fb397d87971acc0c1fe",
]

# The client of the session tests against a real Redis server (HY-115); an application names its own client.
[dependency-groups]
dev = ["redis==8.1.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polyspec.hyper" = ["py.typed"]

# uv reuses a built package until a cache key changes, so a new source file content must be a key of the install.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
