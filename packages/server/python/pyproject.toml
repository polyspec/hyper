[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-hyper-server"
version = "0.0.29"
description = "Server for the polyspec region protocol: manifest, routing, documents, JSON responses, actions and sessions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # The wheel asset of the template release v0.0.20 with the sha256 of that asset (H21.4, H23.5). uv.lock locks it with
    # its dependencies, and `make hyper-install-python` installs that lock into the venv of the package (H23.15).
    # The wheel asset of the php-serialize release v0.0.1 with the sha256 of that asset (HY-104).
    "polyspec-php-serialize @ https://github.com/polyspec/php-serialize/releases/download/v0.0.1/polyspec_php_serialize-0.0.1-py3-none-any.whl#sha256=0789bdf0ec9b84f856ec1613782fba17ec41b4b45c5cb6ba78cb97211844866e",
    "polyspec-template @ https://github.com/polyspec/template/releases/download/v0.0.20/polyspec_template-0.0.20-py3-none-any.whl#sha256=dbdeb77ee341c378c4b4262deca2860d30f805924d16274ed3341e73fe962e7b",
]

# The client of the session tests against a real Redis server (HY-115); an application names its own client.
[dependency-groups]
dev = ["redis==8.1.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polyspec.hyper" = ["py.typed"]

# uv reuses a built package until a cache key changes, so a new source file content must be a key of the install.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
