[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-hyper-server"
version = "0.0.22"
description = "Server for the polyspec region protocol: manifest, routing, documents, JSON responses, actions and sessions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # The wheel asset of the template release v0.0.17 with the sha256 of that asset (H21.4, H23.5). `make hyper-install-python`
    # installs this declaration into the venv of the package; pylock.toml, which uv pip compile writes from it and
    # constraints.txt (its header names the command), is the lock that the release consumer installs with the wheel of
    # this package (H23.15).
    "polyspec-template @ https://github.com/polyspec/template/releases/download/v0.0.17/polyspec_template-0.0.17-py3-none-any.whl#sha256=f2ed215a7cfcb729a2d9a912026ee360e42573cd8845656fb1013879e3933066",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polyspec.hyper" = ["py.typed"]
