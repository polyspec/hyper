# Generated by binding from the interface contract; do not edit. Run make bindings to write it again.
[package]
name = "polyspec-hyper-python"
version = "0.0.0"
edition = "2021"
rust-version = "1.99.0"
publish = false

[lib]
name = "_native"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
panic-test = []
fault-test = ["polyspec-hyper/fault-test"]

[dependencies]
polyspec-hyper = { path = "../../rust" }
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", branch = "v1/rust-core", features = ["construct", "lock"] }
polyspec-session-store = { git = "https://github.com/polyspec/session-store.git", branch = "v1/rust-core", default-features = false }
polyspec-template = { git = "https://github.com/polyspec/template.git", branch = "v1/rust-core" }
pyo3 = { version = "=0.30.1", features = ["abi3-py314", "extension-module"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
as_conversions = "deny"
