# The package is the host code of src/ with the native module of the Rust core, which maturin builds from native/
# (binding L-2a); the range of maturin is the one that the binding scaffold writes for every binding package.
[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "polyspec-hyper"
version = "0.0.40"
description = "The server library of the polyspec region protocol for Python; the browser package is @polyspec/hyper-client. Manifest, routing, documents, JSON responses, actions and sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    # The wheel asset of the php-serialization release v0.0.6, published under the package name polyspec-php-serialize, with the sha256 of that asset (HY-104).
    "polyspec-php-serialize @ https://github.com/polyspec/php-serialization/releases/download/v0.0.6/polyspec_php_serialize-0.0.6-py3-none-any.whl#sha256=00d8022dd33432532dbbbd3bed072e33d9243784b5454ddc814f867be14bc716",
    # The wheel assets of the template release v0.0.29 with the sha256 of each asset (H21.4, H23.5, H31.5). A wheel holds
    # the native module of the template binding, so each platform has its asset. uv.lock locks them with their
    # dependencies, and `make hyper-install-python` installs that lock into the venv of the package (H23.15).
    "polyspec-template @ https://github.com/polyspec/template/releases/download/v0.0.29/polyspec_template-0.0.29-cp314-abi3-macosx_11_0_arm64.whl#sha256=a114383656f8f4bcc7c86e5d771b2bbac9283ced26ac8ab16d76c170c674dec5 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polyspec-template @ https://github.com/polyspec/template/releases/download/v0.0.29/polyspec_template-0.0.29-cp314-abi3-manylinux_2_34_aarch64.whl#sha256=c04169d0280aa05525903daaf4554ad45fe459202f81a4e87f2cfe0f20f5009d ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polyspec-template @ https://github.com/polyspec/template/releases/download/v0.0.29/polyspec_template-0.0.29-cp314-abi3-manylinux_2_34_x86_64.whl#sha256=ddffc7f95fe7a10ec2755f541b2afad2664813df32187c3553b478bb80da843b ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # The wheel assets of the session-store release v0.0.7, whose module polyspec.session_store gives the store that the
    # binding of the core takes (HY-97). A wheel holds a native module, so each platform has its asset with its sha256.
    "polyspec-session-store @ https://github.com/polyspec/session-store/releases/download/v0.0.7/polyspec_session_store-0.0.7-cp314-abi3-macosx_11_0_arm64.whl#sha256=913f5c347c95f624502eab4b2010f83a189acbc9cda13dbdcd7f9c0d0aaa749a ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polyspec-session-store @ https://github.com/polyspec/session-store/releases/download/v0.0.7/polyspec_session_store-0.0.7-cp314-abi3-manylinux_2_34_aarch64.whl#sha256=3568348e4fc13f43b3634bf85728602b8d696763c34175d09a8bd4e936daf7b9 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polyspec-session-store @ https://github.com/polyspec/session-store/releases/download/v0.0.7/polyspec_session_store-0.0.7-cp314-abi3-manylinux_2_34_x86_64.whl#sha256=c2ae4a28947af8dada0ccd4ba127ba1e645e8bf014dc28a4bed0698b3964dc29 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # The wheel assets of the php-serialization release v0.0.16, which the session-store wheel requires at that exact
    # version and no registry carries.
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.16/polyspec_php_serialization-0.0.16-cp314-abi3-macosx_11_0_arm64.whl#sha256=3c23767e1e7eebe2fd6ba15c6974c58290a3160f016022dc540481fba231a51d ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.16/polyspec_php_serialization-0.0.16-cp314-abi3-manylinux_2_34_aarch64.whl#sha256=9a2bb8b6ab99e64db642275cf20f5faccf656192d295684e3ab26e2d360d7637 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.16/polyspec_php_serialization-0.0.16-cp314-abi3-manylinux_2_34_x86_64.whl#sha256=003c6bb350e932f8f9a9769d47110d76f5c81ca1d0bbe2b3e83bf3b19ddf7e9c ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # The wheel assets of the json release v0.0.34, whose module polyspec.json the native module of the template binding
    # 0.0.29 imports when it renders. That template package requires it at that exact version and no registry carries it.
    "polyspec-json @ https://github.com/polyspec/json/releases/download/v0.0.34/polyspec_json-0.0.34-cp314-abi3-macosx_11_0_arm64.whl#sha256=ba29ddb049a60c499f2b8f2777f257c91fdabef826f22e2e229d8c916ae4a31e ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polyspec-json @ https://github.com/polyspec/json/releases/download/v0.0.34/polyspec_json-0.0.34-cp314-abi3-manylinux_2_34_aarch64.whl#sha256=e693c7599e7719624c33e3cad916fe1c5c024ef2c2825f5d2c017f531e5fe07b ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polyspec-json @ https://github.com/polyspec/json/releases/download/v0.0.34/polyspec_json-0.0.34-cp314-abi3-manylinux_2_34_x86_64.whl#sha256=1584be32d8a6be67855bc6419fb9cae6bb0c55257a3a3a077ae1580b16346a6d ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# The client of the session tests against a real Redis server (HY-115); an application names its own client.
[dependency-groups]
dev = ["redis==8.1.0"]

# The native module of the core is polyspec.hyper._binding._native, built from the crate of native/; the host code,
# with its py.typed, is the Python source of src/.
[tool.maturin]
module-name = "polyspec.hyper._binding._native"
manifest-path = "native/Cargo.toml"
python-source = "src"

# uv reuses a built package until a cache key changes, so a new source file content must be a key of the install.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }, { file = "native/**/*" }, { file = "../rust/src/**/*" }]
