# The package is the host code of src/ with the native module of the Rust core, which maturin builds from native/
# (binding L-2a); the range of maturin is the one that the binding scaffold writes for every binding package.
[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "polyspec-hyper"
version = "0.0.40"
description = "The server library of the polyspec region protocol for Python; the browser package is @polyspec/hyper-client. Manifest, routing, documents, JSON responses, actions and sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    # The wheel asset of the template release v0.0.27 with the sha256 of that asset (H21.4, H23.5). uv.lock locks it with
    # its dependencies, and `make hyper-install-python` installs that lock into the venv of the package (H23.15).
    # The wheel asset of the php-serialization release v0.0.6, published under the package name polyspec-php-serialize, with the sha256 of that asset (HY-104).
    "polyspec-php-serialize @ https://github.com/polyspec/php-serialization/releases/download/v0.0.6/polyspec_php_serialize-0.0.6-py3-none-any.whl#sha256=00d8022dd33432532dbbbd3bed072e33d9243784b5454ddc814f867be14bc716",
    "polyspec-template @ https://github.com/polyspec/template/releases/download/v0.0.27/polyspec_template-0.0.27-py3-none-any.whl#sha256=f8c8f5de89095ae495ba398e4f4a3205ff1f48459ea9880dcb95a2858f3000d4",
    # The wheel assets of the session-store release v0.0.4, whose module polyspec.session_store gives the store that the
    # binding of the core takes (HY-97). A wheel holds a native module, so each platform has its asset with its sha256.
    "polyspec-session-store @ https://github.com/polyspec/session-store/releases/download/v0.0.4/polyspec_session_store-0.0.4-cp314-abi3-macosx_11_0_arm64.whl#sha256=b151521c004e0acbbcdc8fe85f8db6df31ede90c0d4e74402e57459f3dfbd475 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polyspec-session-store @ https://github.com/polyspec/session-store/releases/download/v0.0.4/polyspec_session_store-0.0.4-cp314-abi3-manylinux_2_34_aarch64.whl#sha256=6d4d113842f9f26ec858ecc50e63acc465ce3bee78b2dbfb48de7f4d52c19a40 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polyspec-session-store @ https://github.com/polyspec/session-store/releases/download/v0.0.4/polyspec_session_store-0.0.4-cp314-abi3-manylinux_2_34_x86_64.whl#sha256=9be7a8e2cd6329c5d96f58261d9afde56b6d7a7b79f23c579295c23d5b4543e9 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # The wheel assets of the php-serialization release v0.0.15, which the session-store wheel requires at that exact
    # version and no registry carries.
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.15/polyspec_php_serialization-0.0.15-cp314-abi3-macosx_11_0_arm64.whl#sha256=5d3e32006a7c56f3630c67baf714ea8aa724bc1bdca228cde4a9881229d0fe0c ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.15/polyspec_php_serialization-0.0.15-cp314-abi3-manylinux_2_34_aarch64.whl#sha256=be9288f59e5677886c0b06d6d277a38eb4b27f1ee5848baec07bd70f0b5d25b3 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.15/polyspec_php_serialization-0.0.15-cp314-abi3-manylinux_2_34_x86_64.whl#sha256=d1b318297ab46fbfb86895ac01c3cd72e17e4f469b03064d2ea275eacce32b58 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# The client of the session tests against a real Redis server (HY-115); an application names its own client.
[dependency-groups]
dev = ["redis==8.1.0"]

# The native module of the core is polyspec.hyper._binding._native, built from the crate of native/; the host code,
# with its py.typed, is the Python source of src/.
[tool.maturin]
module-name = "polyspec.hyper._binding._native"
manifest-path = "native/Cargo.toml"
python-source = "src"

# uv reuses a built package until a cache key changes, so a new source file content must be a key of the install.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }, { file = "native/**/*" }, { file = "../rust/src/**/*" }]
