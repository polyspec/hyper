# The package is the host code of src/ with the native module of the Rust core, which maturin builds from native/
# (binding L-2a); the range of maturin is the one that the binding scaffold writes for every binding package.
[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "polyspec-hyper"
version = "0.0.40"
description = "The server library of the polyspec region protocol for Python; the browser package is @polyspec/hyper-client. Manifest, routing, documents, JSON responses, actions and sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    # The wheel assets of the template release v0.0.32 with the sha256 of each asset (H21.4, H23.5, H31.5). A wheel holds
    # the native module of the template binding, so each platform has its asset. uv.lock locks them with their
    # dependencies, and `make hyper-install-python` installs that lock into the venv of the package (H23.15).
    "polyspec-template @ https://github.com/polyspec/template/releases/download/v0.0.32/polyspec_template-0.0.32-cp314-abi3-macosx_11_0_arm64.whl#sha256=384c06607e9ec38708f9f0b2b0931205af60c57c90a668ec484d26366133a41b ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polyspec-template @ https://github.com/polyspec/template/releases/download/v0.0.32/polyspec_template-0.0.32-cp314-abi3-manylinux_2_34_aarch64.whl#sha256=544961362d330c732983f1f9b7f0f89e7ce9edcf880a74d551baf4a871d9a5ed ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polyspec-template @ https://github.com/polyspec/template/releases/download/v0.0.32/polyspec_template-0.0.32-cp314-abi3-manylinux_2_34_x86_64.whl#sha256=2aba9699db9867565df7d22c28dfcbb77f678b5830d4265224d369d6f65bda61 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # The wheel assets of the session-store release v0.0.8, whose module polyspec.session_store gives the store that the
    # binding of the core takes (HY-97). A wheel holds a native module, so each platform has its asset with its sha256.
    "polyspec-session-store @ https://github.com/polyspec/session-store/releases/download/v0.0.8/polyspec_session_store-0.0.8-cp314-abi3-macosx_11_0_arm64.whl#sha256=c56a208b6a2a1fd454d70cbf795099324d4467bcee07026b6fbe7e86aba40b83 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polyspec-session-store @ https://github.com/polyspec/session-store/releases/download/v0.0.8/polyspec_session_store-0.0.8-cp314-abi3-manylinux_2_34_aarch64.whl#sha256=b2e16f2bfa88dec72e71f63a54acd9c1df418f4caec6ba4a14ae09b43f54b062 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polyspec-session-store @ https://github.com/polyspec/session-store/releases/download/v0.0.8/polyspec_session_store-0.0.8-cp314-abi3-manylinux_2_34_x86_64.whl#sha256=a918c4acbb48edea5fc2243fe1bc8e43d2d5d30b1df384b77fa574d2d34599a5 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # The wheel assets of the php-serialization release v0.0.17, whose module polyspec.php_serialization reads and
    # writes the session records of PHP (HY-104, H35.77) and which the session-store wheel requires at that exact
    # version; no registry carries it.
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.17/polyspec_php_serialization-0.0.17-cp314-abi3-macosx_11_0_arm64.whl#sha256=48e1860034b4571aca8bab07f8b87175de99b43774f13b24f5f08c487bcf26ed ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.17/polyspec_php_serialization-0.0.17-cp314-abi3-manylinux_2_34_aarch64.whl#sha256=fbac98174b00204ced70a5cddc93ba61057837310900590c715ca8568faa0685 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polyspec-php-serialization @ https://github.com/polyspec/php-serialization/releases/download/v0.0.17/polyspec_php_serialization-0.0.17-cp314-abi3-manylinux_2_34_x86_64.whl#sha256=3e176082e065fc86e2f4417fd8adaf225184fe9df6c2f6efb5244f90524feb64 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # The wheel assets of the json release v0.0.40, whose module polyspec.json the native module of the template binding
    # 0.0.32 imports when it renders. That template package requires it at that exact version and no registry carries it.
    "polyspec-json @ https://github.com/polyspec/json/releases/download/v0.0.40/polyspec_json-0.0.40-cp314-abi3-macosx_11_0_arm64.whl#sha256=9336f7aed9e79a9febb215d5d2cb57a703073aa854cb965fb513f0f5090502f8 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "polyspec-json @ https://github.com/polyspec/json/releases/download/v0.0.40/polyspec_json-0.0.40-cp314-abi3-manylinux_2_34_aarch64.whl#sha256=d249a448898baf0bd8792056f684b9bdbb5d9609ca26e8d2893ef2b814f03399 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "polyspec-json @ https://github.com/polyspec/json/releases/download/v0.0.40/polyspec_json-0.0.40-cp314-abi3-manylinux_2_34_x86_64.whl#sha256=d95abaef060db5fcea1a809658ad7890a2b365e7017fb5af5aeafcf1a953fef7 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# The client of the session tests against a real Redis server (HY-115); an application names its own client.
[dependency-groups]
dev = ["redis==8.1.0"]

# The native module of the core is polyspec.hyper._binding._native, built from the crate of native/; the host code,
# with its py.typed, is the Python source of src/.
[tool.maturin]
module-name = "polyspec.hyper._binding._native"
manifest-path = "native/Cargo.toml"
python-source = "src"

# uv reuses a built package until a cache key changes, so a new source file content must be a key of the install.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }, { file = "native/**/*" }, { file = "../rust/src/**/*" }]
