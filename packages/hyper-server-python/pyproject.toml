[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-hyper-server"
version = "0.0.13"
description = "Server for the polyspec region protocol: manifest, routing, documents, JSON responses, actions and sessions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # The git tag v0.0.6 of the template repository carries the Python template package in packages/template-python
    # (H21.4); the wheel form of this dependency is H21.5. No Python lock exists for this package. `make test-python-render`
    # does not install this declaration: it reads the package from the sibling checkout TEMPLATE_REPOSITORY (H15.3-3).
    "polyspec-template @ git+https://github.com/polyspec/template@v0.0.6#subdirectory=packages/template-python",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polyspec.hyper" = ["py.typed"]
