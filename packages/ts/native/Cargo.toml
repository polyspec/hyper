# Generated by binding from the interface contract; do not edit. Run make bindings to write it again.
[package]
name = "polyspec-hyper-node"
version = "0.0.0"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "polyspec_hyper_node"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
panic-test = []
fault-test = ["polyspec-hyper/fault-test", "polyspec-http-negotiation/fault-test", "polyspec-session-store/fault-test", "polyspec-template/fault-test"]
thread-test = []
thrown-count-test = []

[build-dependencies]
napi-build = "=2.6.0"

[dependencies]
polyspec-hyper = { path = "../../rust" }
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", branch = "v1/rust-core", features = ["construct", "lock"] }
polyspec-http-cookie = { git = "https://github.com/polyspec/http-cookie.git", branch = "v1/rust-core" }
polyspec-http-negotiation = { git = "https://github.com/polyspec/http-negotiation.git", branch = "v1/rust-core" }
polyspec-php-serialization = { git = "https://github.com/polyspec/php-serialization.git", branch = "v1/rust-core" }
polyspec-session-store = { git = "https://github.com/polyspec/session-store.git", branch = "v1/rust-core", default-features = false }
polyspec-template = { git = "https://github.com/polyspec/template.git", branch = "v1/rust-core" }
napi = { version = "=3.16.2", default-features = false, features = ["napi8"] }
napi-derive = "=3.7.1"

[lints]
workspace = true
