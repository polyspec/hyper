# One workspace: the core crate and the binding crates, which the binding scaffold writes into packages/<lang>/native/
# of the three hosts and into packages/go/internal/ffi (binding design L-2, L-2a). One Cargo.lock at the root pins every
# dependency of all of them, the commit of polyspec-binding-core included. The WASM crate is not in the tree: the scaffold
# writes it to packages/ts/native/wasm with the core at ../../rust, a directory that does not exist, and a member whose
# path dependency is missing stops Cargo from reading the workspace.
[workspace]
resolver = "2"
members = [
  "packages/rust",
  "packages/python/native",
  "packages/ts/native",
  "packages/php/native",
  "packages/go/internal/ffi",
]

# Every warning fails, no unsafe code, no unwrap or expect, no discarded result, and every allow attribute names its
# rule; clippy.toml disallows the methods that turn an Err or a None into a value (plan R-1). The binding crates carry
# the same lints themselves, with unsafe_code deny instead of forbid.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
