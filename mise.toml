# The tools that mise installs into var/tools/mise: `make toolchain-lock` writes their digests into mise.lock and
# `make install-tools` installs them with `mise install --locked`. node and python are at the pins of kit, go and wasm-bindgen at those of binding.
[tools]
node = "26.12.0"
# npm is at the pin of kit (K938); devEngines of package.json names the same version.
"npm:npm" = "12.2.0"
python = "3.14.8"
uv = "0.12.24"
ruff = "0.17.3"
"github:asamarts/alint" = "0.18.2"
# The release of the go directive of packages/go/go.mod (binding GN-15), with its gofmt, which make test-go runs.
go = "1.27.3"
# The wasm-bindgen CLI writes the glue of the WASM crate and is the release of its wasm-bindgen crate (binding GN-18).
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
"pypi:vulture" = "2.16"
"http:composer" = { version = "2.10.3", url = "https://getcomposer.org/download/{{ version }}/composer.phar", checksum = "sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6", bin = "composer" }
# The PIE PHAR builds and installs the template extension from the Composer repository of the template release (H27.45); its
# sha256 is that of the release asset pie.phar.
"http:pie" = { version = "1.4.10", url = "https://github.com/php/pie/releases/download/{{version}}/pie.phar", checksum = "sha256:b88792235c8e80be568436d4cb043b49fd1869c89b64e83d23e2882ae19d70a8", bin = "pie" }

# The settings of mise and uv of this checkout, which mise reads from this file (MISE_GLOBAL_CONFIG_FILE of the Makefile) and
# passes to the tools it runs: mise installs and runs only what mise.lock pins and installs nothing on first use (HR-81), and
# uv downloads no Python, takes the Python of PATH, where the shims of mise come first, before a managed Python of the home,
# reads no uv.toml of the home and keeps its cache under var/tools.
[settings]
locked = true
auto_install = false

[env]
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON_PREFERENCE = "only-system"
UV_NO_CONFIG = "1"
UV_CACHE_DIR = "{{config_root}}/var/tools/mise/cache/uv"
