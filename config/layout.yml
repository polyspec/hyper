# The folder layout of hyper (S5, S7, S9), checked by make layout-check with the alint of var/tools: the common rules of
# config/layout.kit.yml, which hyper keeps from the example of kit, and the map of this repository.
version: 1
extends:
  - layout.kit.yml

rules:
  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: hyper }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: hyper }

  # S7: the cross-language runners and the tool tests of the root tests/.
  - id: layout-root-tests
    paths:
      - "tests/*"
      - "!tests/kit"
      # The browser end-to-end cases, which run one board against the Node, PHP and Python servers (make e2e).
      - "!tests/e2e"
      # The project that installs the npm packages of packages/ together, links them and runs them under node (make package-check).
      - "!tests/package-install"
      # The tool tests of scripts/, the Makefile, the workflows and the configuration (make hyper-test-scripts).
      - "!tests/scripts"
      # The tool test of the build copies on the virtiofs mounts of a Linux container (make virtiofs-check).
      - "!tests/virtiofs"
      # The package-data test of the Python distribution (make hyper-test-python): it checks pyproject.toml and the marker py.typed
      # and implements no contract, so the parity declaration lists it as a tool, which cannot lie in the root of the Python
      # implementation.
      - "!tests/python_package"

  # S5: the root files of hyper beyond the list of kit (K145).
  # .npmrc: the npm configuration of the root project; npm reads a project .npmrc only from the root of the project.
  - id: layout-root-files
    vars: { root_files: ".npmrc" }

  # S5: hyper has three components. The browser package and the build package are TypeScript packages without ports; the
  # server of the region protocol has its ports in packages/server/<runtime>/ (ts for Node.js, php, python).
  - id: layout-packages
    paths:
      - "packages/*"
      - "!packages/go"
      - "!packages/php"
      - "!packages/php-ext"
      - "!packages/python"
      - "!packages/rust"
      - "!packages/ts"
      - "!packages/js"
      - "!packages/client"
      - "!packages/build"
      - "!packages/server"

  - extends_template: component-ports
    id: layout-server-ports
    vars: { component: server }

  # S9: the infrastructure under scripts/ and tests/ is TypeScript (the list of kit, with one exception). tests/python_package is
  # the package-data test of the Python distribution: it reads pyproject.toml with tomllib, the TOML parser of the Python
  # standard library, and runs under unittest, the runner of its language; a harness that drives one language is a test of that
  # language.
  - id: layout-infrastructure-typescript
    paths:
      - "scripts/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "tests/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "!tests/kit/fixture/**"
      - "!tests/python_package/**"
      # One real process of the PHP, Python and Node server over one session (HY-104): the test drives each server in its
      # own language, so a port to TypeScript would test no server.
      - "!tests/scripts/fixtures/session-worker/**"
      # One real process of the PHP, Node and Python server over the request bodies of a list, and one real server of
      # each over HTTP (HY-131): the tests compare the servers in their own languages, so a port to TypeScript would
      # compare nothing.
      - "!tests/scripts/fixtures/multipart-worker/**"
      - "!tests/scripts/fixtures/upload-server/**"
      # The sources of the fixture of the recipe check (HYR-8): PHP, Node and Python files that the reader of each
      # language reads, with the stand-in of the Composer autoloader that the PHP reader requires.
      - "!tests/scripts/fixtures/recipe/**"
      # The readers of the recipe check (HYR-8): the PHP readers read the classes with the reflection of PHP and the
      # tokens of token_get_all, and the Python readers the modules with the ast module of Python, which TypeScript
      # does not have.
      - "!scripts/recipe/read-php.php"
      - "!scripts/recipe/read-php-functions.php"
      - "!scripts/recipe/read-php-scopes.php"
      - "!scripts/recipe/PhpScope.php"
      - "!scripts/recipe/read_python.py"
      - "!scripts/recipe/read_python_scopes.py"
