# The full suite on GitHub (HR-91): the push of main and every manual run (workflow_dispatch) run one job per CI group, the
# entries of the matrix, which name CI_GROUPS of the Makefile. Each job has one run step, `make ci-check NAME=<group>`, the
# call that a local run makes too (HR-90): the recipe runs the setup of the group in its order and stops at its first
# failure, runs every target of the group to its end with `make ci-targets` and always writes the report var/ci/<name>/ and
# the job summary with `make ci-summary`: the record with the status, the time and the first failure lines of each target,
# the full log of each target, the outcome of each setup step and the summary. The targets of the groups are together the
# targets of CHECK_TARGETS of the Makefile, each once (tests/scripts/ci-workflow.test.mts), and the group gates runs
# GATE_TARGETS, the checkers of kit on this checkout. A failure never stops the run: the matrix does not cancel the other
# entries (fail-fast: false), and the report is uploaded after a failed step (`if: ${{ !cancelled() }}`). The last job,
# ci-passed, passes only when every other job of this workflow passed; a release takes the id of such a run and tags its
# commit (HR-94, HR-95). Every other step of a job is a uses: step that provisions the runner or carries the report, the
# jobs run on ubuntu-26.04-arm, the actions are pinned by commit and no step has a time limit (HR-90). The job assets
# calls assets.yml, the workflow that a release calls for its tag, and ci-passed needs it too.
#
# Each job checks hyper out at the workspace root with its history, which the document and owner checks read, and runs the
# bootstrap right after the checkout (uses: ./.github/actions/bootstrap), which sets up the Node.js of mise.toml and installs
# the locked kit package, the npm of devEngines and the packages. A group whose tools hold PHP sets up the PHP of
# .php-version (matrix.php); its tools and its native package environments are those that the group declares in the
# Makefile, installed at the versions and hashes that this checkout declares. No job checks out another repository: every
# template asset comes from the template release that the manifests and their locks pin by integrity. No check job waits
# for another job or downloads its installed dependencies or build artifacts.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gates
            php: true
          - name: docs
            php: true
          - name: php
            php: true
          - name: node
          - name: board
            php: true
          - name: python
          - name: core
            php: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: ${{ matrix.php }}
        with:
          php-version-file: .php-version
          extensions: pdo_sqlite
          tools: none
          coverage: none
      - run: make ci-check NAME=${{ matrix.name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ci-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/ci/${{ matrix.name }}/
          if-no-files-found: error
  # The assets of each platform of the bindings, built from the commit of the run with the jobs and the recipes of the
  # release (assets.yml, binding GN-19i), so a job of the release that lacks a tool or does not build fails here, before a
  # tag exists. Its jobs run on the runner of each platform.
  assets:
    uses: ./.github/workflows/assets.yml
  # The job that fails the run when any other job did not pass, so a release, which takes a successful run by its id,
  # holds every job (HR-95). It judges the results of the other jobs, so it exists only in CI, and its run step passes them
  # as the JSON of needs. It runs after every other job, also after a failed, skipped or cancelled one (if: always()), and
  # make ci-passed fails unless every job of needs has the result success, so a new job of this workflow is required once it
  # is listed in needs. The bootstrap installs the kit package whose ci-passed utility make ci-passed runs.
  ci-passed:
    if: ${{ always() }}
    needs: [check, assets]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap
      - name: make ci-passed
        run: make ci-passed RESULTS='${{ toJSON(needs) }}' FAIL_SKIPPED=1
