# The full suite on GitHub (HY-91): the push of main and every manual run (workflow_dispatch) run one job per entry of
# the matrix, and each entry runs its `targets` with `make ci-targets`. The targets of the entries together are the
# targets of CHECK_TARGETS of the Makefile, each once (tests/scripts/ci-workflow.test.mts). A failure never stops the run: the matrix does not cancel the other
# entries (fail-fast: false), every step after the first runs after a failed step (`if: ${{ !cancelled() }}`), and
# `make ci-targets` runs every target to its end. Each job writes the job summary and uploads its report var/ci/<name>/:
# the record with the status, the time and the first failure lines of each target, the full log of each target and the
# summary. The last job, ci-passed, passes only when every other job of this workflow passed; a release tag requires
# it on the tagged commit (HY-94, HY-95). Every step that runs a command runs one make target, the jobs run on
# ubuntu-26.04-arm, the actions are pinned by commit and no step has a time limit (HY-90).
#
# The toolchain comes from the pinned files: Node.js, Python and the other tools from mise.toml, which mise installs at
# the digests of mise.lock, and PHP from .php-version. setup-node reads mise.toml only for the node that starts the
# bootstrap (kit K171). Every job, ci-passed too, first runs the bootstrap of the shared tools @polyspec/kit:
# `make install-tools TOOLS=npm` installs mise, the node of mise.toml and the npm of packageManager into
# var/tools and `make install-packages` installs package-lock.json with it, the package included, whose kit.mk has the
# other targets. Every check job then runs `make install-tools`, which installs the Python and Composer of the checkout
# into var/tools, so CI runs the tools of a local run. npm installs the template packages from the assets of the template
# release, and `make install` installs them with Composer (HY-70). The template repository is
# checked out next to this repository at its tag v0.0.8 (TEMPLATE_TAG of the Makefile, HY-80), as ../template of the
# Makefile, and `make install` copies the native extension sources of the commit of that tag (HY-78). `make ext` builds
# the native extension with phpize and php-config of the PHP of setup-php, and only the group board installs Chromium.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docs
            targets: kit-check toolchain-check layout-check typecheck documents-check hooks-check push-gate-commit commits-check owner-validate
          - name: php
            install: true
            targets: dependency-policy-check dependency-policy-mutation-check bench-server-smoke lint analyse-php test-php
          - name: node
            install: true
            targets: templates-check test-scripts test-js test-node package-check
          - name: board
            install: true
            browser: true
            targets: parity server-parity bundle-size e2e
          - name: python
            python: true
            targets: test-python
          # The render tests and the Python server comparison need PHP and the browser.
          - name: python-render
            install: true
            browser: true
            targets: test-python-render server-parity-python
    defaults:
      run:
        working-directory: hyper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          path: hyper
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version-file: hyper/mise.toml
          package-manager-cache: false
      - id: npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - id: packages
        if: ${{ !cancelled() }}
        run: make install-packages
      - id: tools
        if: ${{ !cancelled() }}
        run: make install-tools
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        id: php
        if: ${{ !cancelled() && matrix.install }}
        with:
          php-version-file: hyper/.php-version
          extensions: pdo_sqlite
          tools: none
          coverage: none
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: template
        if: ${{ !cancelled() && matrix.install }}
        with:
          repository: polyspec/template
          ref: v0.0.8
          path: template
      - id: install
        if: ${{ !cancelled() && matrix.install }}
        run: make install
      - id: python
        if: ${{ !cancelled() && matrix.python }}
        run: make install-python
      - id: browser
        if: ${{ !cancelled() && matrix.browser }}
        run: make install-browser
      - id: check
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="${{ matrix.targets }}" CI_REPORT=var/ci/${{ matrix.name }}
      - id: summary
        if: ${{ !cancelled() }}
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: make ci-summary CI_REPORT=var/ci/${{ matrix.name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: report
        if: ${{ !cancelled() }}
        with:
          name: ci-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: hyper/var/ci/${{ matrix.name }}/
          if-no-files-found: error
  # The check that a release tag requires on the tagged commit (HY-95). It runs after every other job, also after a
  # failed, skipped or cancelled one (if: always()), and make ci-passed fails unless every job of needs has the result
  # success, so a new job of this workflow is required once it is listed in needs. Each step needs the step before it, and the
  # bootstrap installs the package whose kit.mk has the target ci-passed.
  ci-passed:
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - name: make install-tools TOOLS=npm
        run: make install-tools TOOLS=npm
      - name: make install-packages
        run: make install-packages
      - name: make ci-passed
        run: make ci-passed RESULTS='${{ toJSON(needs) }}'
