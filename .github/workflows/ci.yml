# The full suite on GitHub (HY-91): the push of main and every manual run (workflow_dispatch) run one job per entry of
# the matrix, and each entry runs its `targets` with `make ci-targets`. The targets of the entries together are the
# targets of CHECK_TARGETS of the Makefile, each once; the entries python and python-3.11 run the same targets on two
# Python releases (tests/scripts/ci-workflow.test.mjs). A failure never stops the run: the matrix does not cancel the other
# entries (fail-fast: false), every step after the first runs after a failed step (`if: ${{ !cancelled() }}`), and
# `make ci-targets` runs every target to its end. Each job writes the job summary and uploads its report var/ci/<name>/:
# the record with the status, the time and the first failure lines of each target, the full log of each target and the
# summary. The last job, ci-passed, passes only when every other job of this workflow passed; a release tag requires
# it on the tagged commit (HY-94, HY-95). Every step that runs a command runs one make target, the jobs run on
# ubuntu-26.04-arm, the actions are pinned by commit and no step has a time limit (HY-90).
#
# The toolchain comes from the pinned files: Node.js from .node-version, PHP from .php-version, Python from
# .python-version, and npm and Composer from `make install` into var/tools of the checkout. `make install` installs the
# template packages from the assets of the template release with npm and Composer (HY-70). The template repository is
# checked out next to this repository at its tag v0.0.5 (TEMPLATE_TAG of the Makefile, HY-80), as ../template of the
# Makefile, and `make install` copies the native extension sources of the commit of that tag (HY-78). `make ext` builds
# the native extension with phpize and php-config of the PHP of setup-php, and only the group board installs Chromium.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docs
            targets: kit-check kit-test documents-check hooks-check push-gate-commit commits-check owner-validate
          - name: php
            install: true
            targets: dependency-policy-check dependency-policy-mutation-check bench-server-smoke lint analyse-php test-php
          - name: node
            install: true
            targets: templates-check test-scripts test-js test-node package-check
          - name: board
            install: true
            browser: true
            targets: parity server-parity bundle-size e2e
          # The Python group runs on 3.11, the oldest supported release, and on the release of .python-version.
          - name: python-3.11
            python: '3.11'
            targets: test-python
          - name: python
            targets: test-python
          # The render tests and the Python server comparison need the template checkout, PHP and the browser.
          - name: python-render
            install: true
            browser: true
            targets: test-python-render server-parity-python
    defaults:
      run:
        working-directory: hyper
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        id: checkout
        with:
          path: hyper
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version-file: hyper/.node-version
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v7.0.0
        id: python
        if: ${{ !cancelled() }}
        with:
          python-version: ${{ matrix.python }}
          python-version-file: hyper/.python-version
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        id: php
        if: ${{ !cancelled() && matrix.install }}
        with:
          php-version-file: hyper/.php-version
          extensions: pdo_sqlite
          tools: none
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        id: template
        if: ${{ !cancelled() && matrix.install }}
        with:
          repository: polyspec/template
          ref: v0.0.5
          path: template
      - id: install
        if: ${{ !cancelled() && matrix.install }}
        run: make install
      - id: browser
        if: ${{ !cancelled() && matrix.browser }}
        run: make install-browser
      - id: check
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="${{ matrix.targets }}" CI_REPORT=var/ci/${{ matrix.name }}
      - id: summary
        if: ${{ !cancelled() }}
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: make ci-summary CI_REPORT=var/ci/${{ matrix.name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: report
        if: ${{ !cancelled() }}
        with:
          name: ci-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: hyper/var/ci/${{ matrix.name }}/
          if-no-files-found: error
  # The check that a release tag requires on the tagged commit (HY-95). It runs after every other job, also after a
  # failed, skipped or cancelled one (if: always()), and make ci-passed fails unless every job of needs has the result
  # success, so a new job of this workflow is required once it is listed in needs. Each step needs the step before it.
  ci-passed:
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: make ci-passed
        run: make ci-passed RESULTS='${{ toJSON(needs) }}'
