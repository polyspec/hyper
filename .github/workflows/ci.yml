# The full suite on GitHub (HR-91): the push of main and every manual run (workflow_dispatch) run one job per entry of
# the matrix, and each entry runs its `targets` with `make ci-targets`. The targets of the entries together are the
# targets of CHECK_TARGETS of the Makefile, each once (tests/scripts/ci-workflow.test.mts). A failure never stops the run: the matrix does not cancel the other
# entries (fail-fast: false), every step after the first runs after a failed step (`if: ${{ !cancelled() }}`), and
# `make ci-targets` runs every target to its end. Each job writes the job summary and uploads its report var/ci/<name>/:
# the record with the status, the time and the first failure lines of each target, the full log of each target and the
# summary. The last job, ci-passed, passes only when every other job of this workflow passed; a release tag requires
# it on the tagged commit (HR-94, HR-95). Every step that runs a command runs one make target, the jobs run on
# ubuntu-26.04-arm, the actions are pinned by commit and no step has a time limit (HR-90).
#
# Each matrix entry declares its own selected tools and native package environments. The Node/npm bootstrap loads
# the shared control tools; selected installation then uses the versions and hashes already declared by this checkout.
# PHP setup and Composer projects run only for entries that execute PHP. Python packages are installed from uv.lock
# only where Python code is executed. Build prerequisites remain owned by each checking target and run in that job.
# No check job waits for another job or downloads its installed dependencies or build artifacts.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docs
            tools: node php composer phpcs phpstan python uv ruff alint vulture
            php: true
            symbols: php
            composer: true
            python: true
            targets: kit-check toolchain-check layout-check typecheck lint-ts docs-check hooks-check owner-validate rules-check rebuild-check language-check test-markers-check duplication-check bypass-check divergence-check suppression-check hyper-test-scripts
          - name: php
            tools: node php composer phpcs phpstan
            php: true
            template: true
            symbols: php
            composer: true
            targets: bench-server-smoke hyper-lint analyse-php hyper-test-php lint-php
          - name: node
            tools: node
            targets: templates-check hyper-test-js hyper-test-node package-check
          - name: board
            tools: node php composer python uv
            php: true
            template: true
            composer: true
            python: true
            browser: true
            targets: parity server-parity server-parity-python bundle-size e2e
          - name: python
            tools: node python uv ruff vulture
            python: true
            targets: hyper-test-python hyper-test-python-render lint-python
          # Every compared implementation is installed and built in this job.
          - name: language-parity
            tools: node php composer python uv
            php: true
            template: true
            symbols: php
            composer: true
            python: true
            targets: parity-declarations-check parity-check
    defaults:
      run:
        working-directory: hyper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          path: hyper
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version-file: hyper/mise.toml
          package-manager-cache: false
      - id: bootstrap
        if: ${{ !cancelled() }}
        run: make bootstrap
      - id: npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - id: packages
        if: ${{ !cancelled() }}
        run: make install-packages
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        id: php
        if: ${{ !cancelled() && matrix.php }}
        with:
          php-version-file: hyper/.php-version
          extensions: pdo_sqlite
          tools: none
          coverage: none
      - id: tools
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS="${{ matrix.tools }}"
      - id: symbols
        if: ${{ !cancelled() && matrix.symbols }}
        run: make kit-install-symbols EXTRACTORS="${{ matrix.symbols }}"
      - id: hooks
        if: ${{ !cancelled() }}
        run: make hooks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: template
        if: ${{ !cancelled() && matrix.template }}
        with:
          repository: polyspec/template
          ref: v0.0.13
          path: template
      - id: install
        if: ${{ !cancelled() && matrix.composer }}
        run: make hyper-install-php
      - id: python
        if: ${{ !cancelled() && matrix.python }}
        run: make hyper-install-python
      - id: browser
        if: ${{ !cancelled() && matrix.browser }}
        run: make hyper-install-browser
      - id: check
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="${{ matrix.targets }}" CI_REPORT=var/ci/${{ matrix.name }}
      - id: summary
        if: ${{ !cancelled() }}
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: make ci-summary CI_REPORT=var/ci/${{ matrix.name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: report
        if: ${{ !cancelled() }}
        with:
          name: ci-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: hyper/var/ci/${{ matrix.name }}/
          if-no-files-found: error
  # The check that a release tag requires on the tagged commit (HR-95). It runs after every other job, also after a
  # failed, skipped or cancelled one (if: always()), and make ci-passed fails unless every job of needs has the result
  # success, so a new job of this workflow is required once it is listed in needs. Each step needs the step before it, and the
  # bootstrap installs the package whose kit.mk has the target ci-passed.
  ci-passed:
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - name: make bootstrap
        run: make bootstrap
      - name: make install-tools TOOLS=npm
        run: make install-tools TOOLS=npm
      - name: make install-packages
        run: make install-packages
      - name: make ci-passed
        run: make ci-passed RESULTS='${{ toJSON(needs) }}'
