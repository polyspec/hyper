# The benchmarks on a runner of their own (docs/operations/benchmark.md): a manual run on main runs make bench and
# make bench-sessions one after another in one job, so nothing else of this repository runs on the machine while they
# measure. The job has one run step, `make ci-bench`, the call that a local run makes too (HR-90): the recipe runs the
# setup of the group bench of the Makefile, stopping at its first failure, then both targets with `make ci-targets`, and
# always writes the report var/ci/bench/ and the job summary, which the last step uploads. The results are reports: they
# pass or fail no check, no target of CHECK_TARGETS runs here, and neither ci-passed nor a release reads this workflow.
name: bench

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          extensions: pdo_sqlite
          tools: none
          coverage: none
      - run: make ci-bench
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/ci/bench/
          if-no-files-found: error
