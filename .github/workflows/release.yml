# The release of hyper (HR-95). The workflow starts by itself when a push run of the CI workflow ci succeeds on main: it checks
# out the head_sha of that run, and release-tag with AUTO releases it only when it is the version commit of the top ## X.Y.Z of
# its change log, which is the tip of its push; a commit whose top version is tagged elsewhere ends green with nothing to
# release, and a top version that no run released fails and names its version commit. A concurrency group of the job runs one
# release at a time. A dispatch of the workflow with the id of a successful CI run releases the commit of that run. The run is
# the evidence; the release runs no test again. The steps run in order and stop at the first failure, and each step runs one
# make target of the Makefile with TAG, vX.Y.Z, from the environment, which release-tag writes:
#   bootstrap            the Node.js of mise.toml, the lock, the mise, node and npm of mise.toml and the packages
#   release-tag          requires a completed successful push or dispatch run RUN of ci.yml whose commit is on origin/main,
#                        reads X.Y.Z from the change log of that commit, creates and pushes the annotated tag vX.Y.Z at that
#                        commit, or passes for a tag there already, and appends TAG and VERSION to GITHUB_ENV
#   release-checkout     checks the tag out, then the bootstrap of the tagged commit runs again
#   release-archive-tool requires Info-ZIP, which builds the Composer archives
#   release-prepare      installs as make hyper-install does
#   release-tools        installs the tools that config/release.json needs
#   release-tools-path   puts var/tools/bin and the shims of mise on the PATH of the steps that follow
#   release-assets       builds the archive of every package, and packages.json of the Composer packages, into var/release/assets
#   release-publish      creates the GitHub Release of the tag as a draft, with its notes and those files
#   release-undraft      makes the release public
# A failed step leaves the release a draft and fails the run.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful CI run whose exact commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    # A workflow_run starts the release for a successful push or dispatch run of CI alone. The concurrency group is the job's,
    # so a run whose job is skipped never replaces the pending release of a version commit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    env:
      RUN: ${{ inputs.run || github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # With the whole history and every branch, so origin/main is there for the ancestry check; a workflow_run checks out the
      # head_sha of its CI run, never a later main, and a dispatch checks out main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/bootstrap
      - name: tag the commit of the CI run
        run: make release-tag ${{ github.event_name == 'workflow_run' && 'AUTO=1' || '' }}
      - name: check out the tag
        if: ${{ env.TAG != '' }}
        run: make release-checkout
      # The release builds the tagged commit with its own kit and packages.
      - uses: ./.github/actions/bootstrap
        if: ${{ env.TAG != '' }}
      # The PHP of .php-version for the Composer packages and the extension of the release, with no debugger or coverage
      # driver, as the checks run.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: ${{ env.TAG != '' }}
        with:
          php-version-file: .php-version
          coverage: none
      - name: require the Composer archive tool
        if: ${{ env.TAG != '' }}
        run: make release-archive-tool
      - name: prepare the release
        if: ${{ env.TAG != '' }}
        run: make release-prepare
      - name: install the tools of the release
        if: ${{ env.TAG != '' }}
        run: make release-tools
      - name: put the installed tools on PATH
        if: ${{ env.TAG != '' }}
        run: make release-tools-path
      - name: build the assets
        if: ${{ env.TAG != '' }}
        run: make release-assets
      - name: create the draft release
        if: ${{ env.TAG != '' }}
        run: make release-publish
      - name: make the release public
        if: ${{ env.TAG != '' }}
        run: make release-undraft
