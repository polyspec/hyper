# Release: a tag push creates the GitHub Release of the tag. Until version 0.1 main is pushed once, when every task is
# done, and the push runs .github/workflows/ci.yml (HY-94); the maintainer releases by tagging a commit of main vX.Y.Z
# after the version-bump commit and after the check ci-passed of that commit succeeded (HY-95). In a tag filter * does not
# match /, so '**/v*' covers the tag of a Go module at any depth; this repository has no Go module. The steps run in order
# and stop at the first failure, because each step needs the one before it (scripts/kit/release.mjs, config/release.json):
# make release-verify requires the tagged commit on origin/main with the check run ci-passed concluded success, without
# running the tests again; make release-versions requires the version of the tag in every manifest and its section in
# CHANGELOG.md and CHANGELOG.ko.md; make release-assets builds the archives <package>-<language>-<version>.<ext> (npm pack
# of packages/hyper-js, packages/hyper-node and packages/hyper-build, a zip of packages/hyper-php); make release-publish
# creates the GitHub Release with the section as notes and the archives attached. TAG reaches the make targets through the
# environment, never as shell text. The setup is the one of the job check of ci.yml: Node.js from .node-version, Python
# from .python-version, PHP from .php-version, the template repository at its tag v0.0.5 (TEMPLATE_TAG of the Makefile,
# HY-80) next to this repository, and make install. Every step that runs a command runs one make target, the job runs on
# ubuntu-26.04-arm and the actions are pinned by commit (HY-90, tests/scripts/ci-workflow.test.mjs).
name: release

on:
  push:
    tags: ['v*', '**/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04-arm
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: hyper
    steps:
      # The whole history and every branch, so origin/main is there for the ancestry check.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: hyper
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: hyper/.node-version
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v7.0.0
        with:
          python-version-file: hyper/.python-version
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version-file: hyper/.php-version
          extensions: pdo_sqlite
          tools: none
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: polyspec/template
          ref: v0.0.5
          path: template
      - name: make install
        run: make install
      - name: verify the tagged commit
        run: make release-verify
      - name: check the versions
        run: make release-versions
      - name: build the assets
        run: make release-assets
      - name: create the release
        run: make release-publish
