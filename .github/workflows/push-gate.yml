# The push gate on GitHub (AGENTS.md): a push happens only when no checklist task is in progress. The job push-gate runs
# the gate of the pre-push hook on the pushed commit of every branch, on the head commit of every pull request and on
# every merge group of the merge queue, the commit that main receives (HY-94), so a push that did not run the hook still
# fails here. It fails for a task in progress, for a commit without the checklist and for a commit that does not track
# .githooks/pre-push as an executable file, and names each in the job summary. It also runs make docs-check, the
# document and checklist rules, which read no network, so the check that the ruleset main requires (HY-94) fails a
# commit that breaks them. Every step that runs a command runs one make target (tests/scripts/ci-workflow.test.mjs).
name: push-gate

on:
  push:
    branches-ignore: ['gh-readonly-queue/**']
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  push-gate:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: ${{ !cancelled() }}
        with:
          node-version-file: .node-version
      - run: make push-gate-commit COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
        if: ${{ !cancelled() }}
      - run: make docs-check
        if: ${{ !cancelled() }}
