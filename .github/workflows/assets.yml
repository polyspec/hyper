# The assets of each platform of the bindings of hyper (binding GN-19a, GN-19i). The workflow ci calls it for the commit of
# its run, and the workflow release calls it for the tree of the tag that it releases, with release true. Each job has one
# run step, make ci-assets-<job> (HR-90), with the values of its matrix and the input release as make variables: the
# recipe installs the tools that it starts, Go among them, writes the release recipes (make release-recipes,
# packages/release.mk) and checks the bindings before it builds: with RELEASE=true the release check of binding (make
# release-binding-check), and for ci the check without the rule of a release (make bindings-check), which starts the same
# tools, so a job that lacks a tool fails in ci, before a tag exists.
#
# The jobs platform and php run on the runner of their platform, ubuntu-26.04, ubuntu-26.04-arm or macos-15, the one
# exception to the runner rule of AGENTS.md: the asset of a platform is built and loaded on that platform alone, because no
# tool of the release compiles for another platform (tests/scripts/ci-workflow.test.mts checks the entries). The job
# platform builds the static library of the Go module, the abi3 wheel and the npm platform package of its platform; the
# job php builds the PHP extension of one platform and one PHP minor of phpExtension.minors of config/toolchain.json; the
# job npm packs the npm package @polyspec/hyper with its WASM module. Each job uploads var/release/assets as an artifact,
# which the workflow release downloads.
name: assets

on:
  workflow_call:
    inputs:
      ref:
        description: The tag whose tree the jobs build; empty builds the commit of the calling run
        required: false
        type: string
        default: ''
      release:
        description: Whether each job runs the release check of binding before it builds
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      # The whole history, whose commit time release-wheel reads to date the files of the wheel.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/bootstrap
      - name: make ci-assets-platform
        run: make ci-assets-platform RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-${{ matrix.platform }}
          path: var/release/assets/
          if-no-files-found: error

  php:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.4'
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.5'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.4'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.5'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.4'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.5'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/bootstrap
      # The PHP of the matrix entry, one minor in a job of its own, with no debugger or coverage driver; the recipe builds
      # the extension for it and checks its minor against EXPECTED_PHP_MINOR.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      # The LLVM of config/toolchain.json (llvm.version), whose libclang and clang the bindgen of ext-php-rs reads (binding
      # GN-19i). The ubuntu-26.04 images hold it at /usr/lib/llvm-<major>; the macos-15 image does not, so the step installs
      # it there and sets LLVM_PATH, which make ci-assets-php passes as LLVM_ROOT.
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        if: runner.os == 'macOS'
        with:
          version: '21.1.8'
          directory: ${{ runner.temp }}/llvm
      - name: make ci-assets-php
        run: make ci-assets-php EXPECTED_PHP_MINOR=${{ matrix.php }} RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-php-${{ matrix.platform }}-${{ matrix.php }}
          path: var/release/assets/
          if-no-files-found: error

  npm:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/bootstrap
      - name: make ci-assets-npm
        run: make ci-assets-npm RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-npm
          path: var/release/assets/
          if-no-files-found: error
